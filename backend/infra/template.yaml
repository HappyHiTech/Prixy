AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Prixy backend - API Gateway + Lambda functions

Metadata:
  DbVpcConfig: &dbVpcConfig
    SecurityGroupIds:
      - sg-0e9a01494cd64eac2
    SubnetIds:
      - subnet-00fcbf804a78fef47
      - subnet-0d3750fde81200b62
  DbEnvironment: &dbEnvironment
    Variables:
      DB_HOST: prixy-db.cx42cyay04z3.us-west-2.rds.amazonaws.com
      DB_PORT: "5432"
      DB_NAME: Prixy
      DB_USER: lambda_app_user
  DbPolicies: &dbPolicies
    - Statement:
        - Effect: Allow
          Action:
            - rds-db:connect
          Resource:
            - "arn:aws:rds-db:us-west-2:824648489396:dbuser:db-6CXJKUEBM5CEHIECSV4AIQVK5A/lambda_app_user"
  # More memory buys proportionally more CPU, which speeds up the RDS IAM
  # token signing + TLS handshake that dominates cold-start time for these
  # functions. Same reasoning as CreateAuthChallenge/PostConfirmation below.
  DbFunctionMemory: &dbFunctionMemory 512

Globals:
  Function:
    Runtime: nodejs22.x
    Timeout: 10
    MemorySize: 128

Resources:
  PrixyApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: dev
      Auth:
        Authorizers:
          CognitoAuth:
            UserPoolArn: !GetAtt UserPool.Arn
        AddDefaultAuthorizerToCorsPreflight: false
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: prixy-users
      UsernameAttributes:
        - email
      AutoVerifiedAttributes:
        - email
      Schema:
        - Name: email
          AttributeDataType: String
          Required: true
          Mutable: true
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: true
      LambdaConfig:
        PreSignUp: !GetAtt PreSignUpFunction.Arn
        DefineAuthChallenge: !GetAtt DefineAuthChallengeFunction.Arn
        CreateAuthChallenge: !GetAtt CreateAuthChallengeFunction.Arn
        VerifyAuthChallengeResponse: !GetAtt VerifyAuthChallengeFunction.Arn
        PostConfirmation: !GetAtt PostConfirmationFunction.Arn

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: prixy-mobile
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_CUSTOM_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      PreventUserExistenceErrors: LEGACY
      AccessTokenValidity: 1
      IdTokenValidity: 1
      RefreshTokenValidity: 30
      TokenValidityUnits:
        AccessToken: hours
        IdToken: hours
        RefreshToken: days

  PreSignUpFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../functions/auth/pre-signup/
      Handler: index.handler

  PreSignUpPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !GetAtt PreSignUpFunction.Arn
      Principal: cognito-idp.amazonaws.com
      SourceArn: !GetAtt UserPool.Arn

  DefineAuthChallengeFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../functions/auth/define-auth-challenge/
      Handler: index.handler

  DefineAuthChallengePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !GetAtt DefineAuthChallengeFunction.Arn
      Principal: cognito-idp.amazonaws.com
      SourceArn: !GetAtt UserPool.Arn

  CreateAuthChallengeFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../functions/auth/create-auth-challenge/
      Handler: index.handler
      # 128MB gives a fraction of a vCPU; the SES HTTPS call and SDK init are
      # CPU-bound, so more memory buys proportionally more CPU. Billing is
      # ms x memory, so finishing faster largely offsets the higher rate.
      MemorySize: 512
      Environment:
        Variables:
          SES_FROM_ADDRESS: harveycytan@gmail.com
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - ses:SendEmail
              Resource: "*"

  CreateAuthChallengePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !GetAtt CreateAuthChallengeFunction.Arn
      Principal: cognito-idp.amazonaws.com
      SourceArn: !GetAtt UserPool.Arn

  VerifyAuthChallengeFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../functions/auth/verify-auth-challenge/
      Handler: index.handler

  VerifyAuthChallengePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !GetAtt VerifyAuthChallengeFunction.Arn
      Principal: cognito-idp.amazonaws.com
      SourceArn: !GetAtt UserPool.Arn

  PostConfirmationFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: ../functions/auth/post-confirmation/
      Handler: index.handler
      # RDS IAM token signing + TLS handshake are CPU-bound; at 128MB this
      # measured 2671ms inside the signup path. See CreateAuthChallenge above.
      MemorySize: *dbFunctionMemory
      Timeout: 30
      VpcConfig: *dbVpcConfig
      Environment: *dbEnvironment
      Policies: *dbPolicies

  PostConfirmationPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !GetAtt PostConfirmationFunction.Arn
      Principal: cognito-idp.amazonaws.com
      SourceArn: !GetAtt UserPool.Arn

  HealthFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../functions/ops/health/
      Handler: index.handler
      Events:
        HealthCheck:
          Type: Api
          Properties:
            RestApiId: !Ref PrixyApi
            Path: /health
            Method: get

  DbHealthFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: ../functions/ops/db-health/
      Handler: index.handler
      MemorySize: *dbFunctionMemory
      VpcConfig: *dbVpcConfig
      Environment: *dbEnvironment
      Policies: *dbPolicies
      Events:
        DbHealthCheck:
          Type: Api
          Properties:
            RestApiId: !Ref PrixyApi
            Path: /db-health
            Method: get

  MigrateFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: ../functions/ops/migrate/
      Handler: index.handler
      Timeout: 60
      MemorySize: *dbFunctionMemory
      VpcConfig: *dbVpcConfig
      Environment: *dbEnvironment
      Policies: *dbPolicies

  # DEV-ONLY: runs arbitrary SQL passed in the invoke payload.
  # Intentionally has no Events block - reachable only via `aws lambda invoke`,
  # which requires IAM credentials. Do not deploy to a stack holding real data.
  QueryFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: ../functions/ops/query/
      Handler: index.handler
      Timeout: 30
      MemorySize: *dbFunctionMemory
      VpcConfig: *dbVpcConfig
      Environment: *dbEnvironment
      Policies: *dbPolicies

  ResetFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: ../functions/ops/reset/
      Handler: index.handler
      Timeout: 30
      MemorySize: *dbFunctionMemory
      VpcConfig: *dbVpcConfig
      Environment: *dbEnvironment
      Policies: *dbPolicies

  ListPrayersFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: ../functions/prayers/list/
      Handler: index.handler
      MemorySize: *dbFunctionMemory
      VpcConfig: *dbVpcConfig
      Environment: *dbEnvironment
      Policies: *dbPolicies
      Events:
        ListPrayers:
          Type: Api
          Properties:
            RestApiId: !Ref PrixyApi
            Path: /prayers
            Method: get
            Auth:
              Authorizer: CognitoAuth

  CreatePrayerFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: ../functions/prayers/create/
      Handler: index.handler
      MemorySize: *dbFunctionMemory
      VpcConfig: *dbVpcConfig
      Environment: *dbEnvironment
      Policies: *dbPolicies
      Events:
        CreatePrayer:
          Type: Api
          Properties:
            RestApiId: !Ref PrixyApi
            Path: /prayers
            Method: post
            Auth:
              Authorizer: CognitoAuth

  BedrockEndpointSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: HTTPS from DB Lambdas to the Bedrock runtime endpoint
      VpcId: vpc-0f0e0e699233fa1e2
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          SourceSecurityGroupId: sg-0e9a01494cd64eac2

  BedrockRuntimeEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcEndpointType: Interface
      ServiceName: !Sub com.amazonaws.${AWS::Region}.bedrock-runtime
      VpcId: vpc-0f0e0e699233fa1e2
      SubnetIds:
        - subnet-00fcbf804a78fef47
      SecurityGroupIds:
        - !Ref BedrockEndpointSecurityGroup
      PrivateDnsEnabled: true

  CapturePrayersFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: ../functions/prayers/capture/
      Handler: index.handler
      MemorySize: *dbFunctionMemory
      # LLM call + two DB round trips. Must stay under API Gateway's 29s cap.
      Timeout: 25
      VpcConfig: *dbVpcConfig
      Environment:
        Variables:
          DB_HOST: prixy-db.cx42cyay04z3.us-west-2.rds.amazonaws.com
          DB_PORT: "5432"
          DB_NAME: Prixy
          DB_USER: lambda_app_user
          BEDROCK_MODEL_ID: global.anthropic.claude-haiku-4-5-20251001-v1:0
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - rds-db:connect
              Resource:
                - "arn:aws:rds-db:us-west-2:824648489396:dbuser:db-6CXJKUEBM5CEHIECSV4AIQVK5A/lambda_app_user"
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource:
                - !Sub "arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/global.anthropic.claude-haiku-4-5-20251001-v1:0"
                - "arn:aws:bedrock:*::foundation-model/anthropic.claude-haiku-4-5-20251001-v1:0"
                - "arn:aws:bedrock:::foundation-model/anthropic.claude-haiku-4-5-20251001-v1:0"
      Events:
        CapturePrayers:
          Type: Api
          Properties:
            RestApiId: !Ref PrixyApi
            Path: /prayers/capture
            Method: post
            Auth:
              Authorizer: CognitoAuth

  ListPrayeesFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: ../functions/prayees/list/
      Handler: index.handler
      MemorySize: *dbFunctionMemory
      VpcConfig: *dbVpcConfig
      Environment: *dbEnvironment
      Policies: *dbPolicies
      Events:
        ListPrayees:
          Type: Api
          Properties:
            RestApiId: !Ref PrixyApi
            Path: /prayees
            Method: get
            Auth:
              Authorizer: CognitoAuth

  CreatePrayeeFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: ../functions/prayees/create/
      Handler: index.handler
      MemorySize: *dbFunctionMemory
      VpcConfig: *dbVpcConfig
      Environment: *dbEnvironment
      Policies: *dbPolicies
      Events:
        CreatePrayee:
          Type: Api
          Properties:
            RestApiId: !Ref PrixyApi
            Path: /prayees
            Method: post
            Auth:
              Authorizer: CognitoAuth

  DeletePrayeeFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: ../functions/prayees/delete/
      Handler: index.handler
      MemorySize: *dbFunctionMemory
      VpcConfig: *dbVpcConfig
      Environment: *dbEnvironment
      Policies: *dbPolicies
      Events:
        DeletePrayee:
          Type: Api
          Properties:
            RestApiId: !Ref PrixyApi
            Path: /prayees/{id}
            Method: delete
            Auth:
              Authorizer: CognitoAuth

  ListCategoriesFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: ../functions/categories/list/
      Handler: index.handler
      MemorySize: *dbFunctionMemory
      VpcConfig: *dbVpcConfig
      Environment: *dbEnvironment
      Policies: *dbPolicies
      Events:
        ListCategories:
          Type: Api
          Properties:
            RestApiId: !Ref PrixyApi
            Path: /categories
            Method: get
            Auth:
              Authorizer: CognitoAuth

  CreateCategoryFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: ../functions/categories/create/
      Handler: index.handler
      MemorySize: *dbFunctionMemory
      VpcConfig: *dbVpcConfig
      Environment: *dbEnvironment
      Policies: *dbPolicies
      Events:
        CreateCategory:
          Type: Api
          Properties:
            RestApiId: !Ref PrixyApi
            Path: /categories
            Method: post
            Auth:
              Authorizer: CognitoAuth

  DeleteCategoryFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: ../functions/categories/delete/
      Handler: index.handler
      MemorySize: *dbFunctionMemory
      VpcConfig: *dbVpcConfig
      Environment: *dbEnvironment
      Policies: *dbPolicies
      Events:
        DeleteCategory:
          Type: Api
          Properties:
            RestApiId: !Ref PrixyApi
            Path: /categories/{id}
            Method: delete
            Auth:
              Authorizer: CognitoAuth

  GetPrayerFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: ../functions/prayers/get/
      Handler: index.handler
      MemorySize: *dbFunctionMemory
      VpcConfig: *dbVpcConfig
      Environment: *dbEnvironment
      Policies: *dbPolicies
      Events:
        GetPrayer:
          Type: Api
          Properties:
            RestApiId: !Ref PrixyApi
            Path: /prayers/{id}
            Method: get
            Auth:
              Authorizer: CognitoAuth

  UpdatePrayerFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: ../functions/prayers/update/
      Handler: index.handler
      MemorySize: *dbFunctionMemory
      VpcConfig: *dbVpcConfig
      Environment: *dbEnvironment
      Policies: *dbPolicies
      Events:
        UpdatePrayer:
          Type: Api
          Properties:
            RestApiId: !Ref PrixyApi
            Path: /prayers/{id}
            Method: patch
            Auth:
              Authorizer: CognitoAuth

  DeletePrayerFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: ../functions/prayers/delete/
      Handler: index.handler
      MemorySize: *dbFunctionMemory
      VpcConfig: *dbVpcConfig
      Environment: *dbEnvironment
      Policies: *dbPolicies
      Events:
        DeletePrayer:
          Type: Api
          Properties:
            RestApiId: !Ref PrixyApi
            Path: /prayers/{id}
            Method: delete
            Auth:
              Authorizer: CognitoAuth

  GetDeckFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: ../functions/deck/get/
      Handler: index.handler
      MemorySize: *dbFunctionMemory
      VpcConfig: *dbVpcConfig
      Environment: *dbEnvironment
      Policies: *dbPolicies
      Events:
        GetDeck:
          Type: Api
          Properties:
            RestApiId: !Ref PrixyApi
            Path: /deck
            Method: get
            Auth:
              Authorizer: CognitoAuth

  PrayPrayerFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: ../functions/prayers/pray/
      Handler: index.handler
      MemorySize: *dbFunctionMemory
      VpcConfig: *dbVpcConfig
      Environment: *dbEnvironment
      Policies: *dbPolicies
      Events:
        PrayPrayer:
          Type: Api
          Properties:
            RestApiId: !Ref PrixyApi
            Path: /prayers/{id}/pray
            Method: post
            Auth:
              Authorizer: CognitoAuth

Outputs:
  ApiUrl:
    Description: Base URL for the deployed API
    Value: !Sub "https://${PrixyApi}.execute-api.${AWS::Region}.amazonaws.com/dev/"

  UserPoolId:
    Description: Cognito user pool id - goes in frontend/.env
    Value: !Ref UserPool

  UserPoolClientId:
    Description: Cognito app client id - goes in frontend/.env
    Value: !Ref UserPoolClient

  MigrateFunctionName:
    Description: Invoke manually to apply SQL migrations
    Value: !Ref MigrateFunction

  QueryFunctionName:
    Description: DEV-ONLY - invoke with {"sql":"..."} to read the database
    Value: !Ref QueryFunction

  ResetFunctionName:
    Description: DEV-ONLY - invoke with {"confirm":"DROP EVERYTHING"} to wipe all tables
    Value: !Ref ResetFunction
