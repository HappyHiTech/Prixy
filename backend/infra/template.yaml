AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Prixy backend - API Gateway + Lambda functions

Metadata:
  DbVpcConfig: &dbVpcConfig
    SecurityGroupIds:
      - sg-0e9a01494cd64eac2
    SubnetIds:
      - subnet-00fcbf804a78fef47
      - subnet-0d3750fde81200b62
  DbEnvironment: &dbEnvironment
    Variables:
      DB_HOST: prixy-db.cx42cyay04z3.us-west-2.rds.amazonaws.com
      DB_PORT: "5432"
      DB_NAME: Prixy
      DB_USER: lambda_app_user
  DbPolicies: &dbPolicies
    - Statement:
        - Effect: Allow
          Action:
            - rds-db:connect
          Resource:
            - "arn:aws:rds-db:us-west-2:824648489396:dbuser:db-6CXJKUEBM5CEHIECSV4AIQVK5A/lambda_app_user"

Globals:
  Function:
    Runtime: nodejs22.x
    Timeout: 10
    MemorySize: 128

Resources:
  PrixyApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: dev

  HealthFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../functions/ops/health/
      Handler: index.handler
      Events:
        HealthCheck:
          Type: Api
          Properties:
            RestApiId: !Ref PrixyApi
            Path: /health
            Method: get

  DbHealthFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: ../functions/ops/db-health/
      Handler: index.handler
      VpcConfig: *dbVpcConfig
      Environment: *dbEnvironment
      Policies: *dbPolicies
      Events:
        DbHealthCheck:
          Type: Api
          Properties:
            RestApiId: !Ref PrixyApi
            Path: /db-health
            Method: get

  MigrateFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: ../functions/ops/migrate/
      Handler: index.handler
      Timeout: 60
      VpcConfig: *dbVpcConfig
      Environment: *dbEnvironment
      Policies: *dbPolicies

  # DEV-ONLY: runs arbitrary SQL passed in the invoke payload.
  # Intentionally has no Events block - reachable only via `aws lambda invoke`,
  # which requires IAM credentials. Do not deploy to a stack holding real data.
  QueryFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: ../functions/ops/query/
      Handler: index.handler
      Timeout: 30
      VpcConfig: *dbVpcConfig
      Environment: *dbEnvironment
      Policies: *dbPolicies

  ListPrayersFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: ../functions/prayers/list/
      Handler: index.handler
      VpcConfig: *dbVpcConfig
      Environment: *dbEnvironment
      Policies: *dbPolicies
      Events:
        ListPrayers:
          Type: Api
          Properties:
            RestApiId: !Ref PrixyApi
            Path: /prayers
            Method: get

Outputs:
  ApiUrl:
    Description: Base URL for the deployed API
    Value: !Sub "https://${PrixyApi}.execute-api.${AWS::Region}.amazonaws.com/dev/"

  MigrateFunctionName:
    Description: Invoke manually to apply SQL migrations
    Value: !Ref MigrateFunction

  QueryFunctionName:
    Description: DEV-ONLY - invoke with {"sql":"..."} to read the database
    Value: !Ref QueryFunction
